name: CI

# Runs on every push/PR: build, test, lint, typecheck across the workspace (checklist item 9's
# release-plan gate), plus the create-mantlejs scaffold smoke test (checklist item 8's e2e-scaffold
# target). Separate from release-publish.yml, which is manual-only and actually publishes to npm.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm 11.2-11.4 crash in Arborist's peer-set resolution (`Cannot read properties of null
      # (reading 'edgesOut')`) when installing vitest's peer graph — hit by both this workspace's
      # own install and the scaffold smoke test below. Fixed upstream; pinned rather than `@latest`
      # since npm 12 requires a newer Node than the version pinned above.
      - name: Upgrade npm (works around an Arborist peer-resolution crash in npm <11.5)
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build, test, lint, typecheck
        run: npx nx run-many -t build,test,lint,typecheck

      - name: create-mantlejs scaffold smoke test
        run: npx nx run create-mantlejs:e2e-scaffold
